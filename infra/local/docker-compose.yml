name: steward
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: steward, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: steward }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U steward"], interval: 5s, retries: 10 }

  sqlserver:                 # backing store the Service Bus emulator requires
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "${SQL_PASSWORD}" }
    healthcheck: { test: ["CMD-SHELL", "exit 0"], interval: 10s }

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on: [sqlserver]
    environment: { ACCEPT_EULA: "Y", SQL_SERVER: sqlserver, MSSQL_SA_PASSWORD: "${SQL_PASSWORD}" }
    volumes: ["./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"]
    ports: ["5672:5672", "5300:5300"]

volumes:
  pgdata:
